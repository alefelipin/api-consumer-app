<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./src/css/styles.css">

  <title>API with Fetch and Axios</title>
</head>
<body>

  <div class="container">

    <header>
      <h1>Fetch and Axios</h1>
      <label for="apiSelector">Select an option:</label>
      <select id="apiSelector" class="header-select">
        <option value="" disabled selected hidden>Select Fetch or Axios</option>
        <option value="fetch">Use Fetch</option>
        <option value="axios">Use Axios</option>
      </select>

      <input
        id="searchInput"
        type="text"
        class="header-input"
        placeholder="Search for..."
      >

      <button
        id="fetchButton"
        class="header-button"
      >
        Fetch Data
      </button>
    </header>

    <main>

      <div id="loadingElement" class="hidden">
        Loading...
      </div>

      <div id="errorElement" class="hidden">
      </div>

      <section id="resultsContainer">
      </section>

      <nav
      id="paginationContainer"
      class="pagination"
      aria-label="pagination"
      >
      </nav>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./src/js/render.js"></script>
  <script src="./src/js/main.js"></script>
  
</body>
</html>
